- name: backend server
  hosts: backend
  become: yes
  vars:
    mysql_root_password: ExpenseApp@1
    login_host: mysql.daws81s.online
  #vars_files:
  #full path evali while uisng vault
  #/var/expence/creditials_mysql.yaml
  tasks:
  - name: disable default nodejs
    ansible.builtin.command: dnf module disable nodejs -y
  - name: enable nodejs:20
    ansible.builtin.command: dnf module enable nodejs:20 -y
  - name: insatll nodejs
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
      enabled: yes
    loop:
    - mysql
    - nodejs
# need to install mysql clint as well so again i need to write code so insted of again write using lopp
  - name: create user expence
    ansible.builtin.user:
    name: expence
  - name: remove existing app loaction
    ansible.builtin.file:
      path: /app
      state: absent
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  - name: Download the application code
    ansible.builtin.get_url:
      url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
      dest: /tmp/backend.zip
  - name: Unarchive a file that is already on the remote machine or extract the code
    ansible.builtin.unarchive:
      src: /tmp/backend.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    ansible.builtin.command: npm install
    args:
      chdir: /app
  - name: Copy backend service
    ansible.builtin.copy:
      src: backend.service
      dest: /etc/systemd/system/backend.service
  - name: import mysql data
    ansible.mysql.mysql_db:
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_host: "{{ login_host }}"
    state: import
    name: all
    target: /app/schema/backend.sql
  - name: restart the backend service
    ansible.builtin.systemd_service:
    name: backend
    daemon_reload: true
    state: started
    enabled: true

